name: ATMON Crawler
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install datasets huggingface_hub pyarrow
      - name: Run Crawler
        run: |
          python -c "
          from datasets import Dataset
          from huggingface_hub import HfApi
          from datetime import datetime
          import os
          print('Crawling ATMON...')
          data = [{'text': 'ATMON test ' + str(datetime.now()), 'url': 'https://example.com', 'time': str(datetime.now())}]
          ds = Dataset.from_list(data)
          ds.to_parquet('test.parquet')
          api = HfApi()
          api.upload_file(path_or_fileobj='test.parquet', path_in_repo=f'crawl_{datetime.now().strftime('%Y%m%d_%H%M%S')}.parquet', repo_id='HarshaAtmon10/Crawler', repo_type='dataset', token=os.environ['HF_TOKEN'])
          print('Done!')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
