name: ATMON 5 BIG CRAWLERS - WORLD CRAWL
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
jobs:
  crawl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 huggingface_hub lxml
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD_ID: ${{ matrix.shard }}
        run: python atmon_crawler.py
