name: ATMON 5 BIG CRAWLERS - WORLD CRAWL

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allows manual run from GitHub button

jobs:
  crawl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install requests beautifulsoup4 huggingface_hub

      - name: Run crawler shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD_ID: ${{ matrix.shard }}
        run: python atmon_crawler.py
