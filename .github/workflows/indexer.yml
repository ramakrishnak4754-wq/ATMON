name: ATMON Step 2 - Auto Indexer
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ATMON Full Real Crawler"]
    types: [completed]
  schedule:
    - cron: '0 1 * * *'

jobs:
  build-index:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name!= 'workflow_run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install datasets huggingface_hub faiss-cpu sentence-transformers --quiet
      - name: Build Index
        run: |
          python << 'PYEOF'
          from datasets import load_dataset
          from sentence_transformers import SentenceTransformer
          import faiss, numpy as np, json, os
          from huggingface_hub import HfApi
          print("=== ATMON STEP 2 START ===")
          ds = load_dataset("HarshaAtmon10/Crawler", split="train")
          print(f"Docs: {len(ds)}")
          if len(ds) < 10:
              print("Data too less")
              exit(0)
          texts = [d['text'][:1000] for d in ds]
          metas = [{"text": t[:500], "url": ds[i].get('url',''), "title": ds[i].get('title','')} for i, t in enumerate(texts)]
          model = SentenceTransformer("intfloat/multilingual-e5-base")
          emb = model.encode([f"passage: {t}" for t in texts], batch_size=32, show_progress_bar=True, normalize_embeddings=True)
          index = faiss.IndexFlatIP(emb.shape[1])
          index.add(np.array(emb, dtype=np.float32))
          faiss.write_index(index, "atmon.index")
          with open("metadata.json", "w", encoding="utf-8") as f:
              json.dump(metas, f, ensure_ascii=False)
          api = HfApi()
          api.upload_file(path_or_fileobj="atmon.index", path_in_repo="search/atmon.index", repo_id="HarshaAtmon10/Crawler", repo_type="dataset", token=os.environ["HF_TOKEN"])
          api.upload_file(path_or_fileobj="metadata.json", path_in_repo="search/metadata.json", repo_id="HarshaAtmon10/Crawler", repo_type="dataset", token=os.environ["HF_TOKEN"])
          print("=== STEP 2 DONE ===")
          PYEOF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
